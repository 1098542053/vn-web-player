<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>VN-Reader - Visual Novel Reader</title><link rel="stylesheet" href="css/style.css"><style>.reader-bg{position:absolute!important;inset:0!important;display:flex!important;justify-content:center!important;align-items:center!important;background:#0a0a14!important;overflow:hidden!important}.reader-bg-16-9{position:relative;width:100%;height:100%;max-width:calc(100vh*16/9);max-height:calc(100vw*9/16);aspect-ratio:16/9;overflow:hidden}.reader-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0;background:#0a0a14}.reader-sprite{position:absolute;inset:0;z-index:1;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}.sprite-layer{position:absolute;bottom:0;height:90%;object-fit:contain;opacity:1;transition:opacity .3s}.dialog-headicon{width:64px;height:64px;border:1px solid var(--border);margin-right:.8rem;flex-shrink:0;object-fit:cover;display:none}.dialog-headicon[src]{display:block}.dialog-row{display:flex;align-items:flex-start}.char-card{display:flex;align-items:center;gap:.8rem}.char-card-img{width:64px;height:64px;object-fit:cover;border:1px solid var(--border)}.char-card-info{flex:1}.select-panel{display:flex;flex-direction:column;align-items:center;gap:1.5rem;padding:2rem;flex:1;justify-content:center}.select-btn{position:relative;width:280px;height:200px;border:2px solid var(--border);cursor:pointer;overflow:hidden;transition:all .2s;display:flex;align-items:center;justify-content:center;background:var(--bg-card)}.select-btn:hover{border-color:var(--accent-dim)}.select-btn-img{width:100%;height:100%;object-fit:cover;opacity:.7}.select-btn:hover .select-btn-img{opacity:.9}.select-btn-label{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:.5rem;background:rgba(10,10,18,.85);color:var(--accent);font-size:1rem;letter-spacing:.2em;border-top:1px solid var(--border)}</style></head><body><div id="app"><div id="screen-title" class="screen active"><div class="title-bg"></div><div class="title-content"><h1 class="title-logo">VN-READER</h1><p class="title-subtitle">Visual Novel Scenario Reader</p><div class="title-menu"><button class="title-btn" onclick="navigateTo('characters')"><span class="btn-bracket">[</span> 角色劇情 <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('main-story')"><span class="btn-bracket">[</span> 主線故事 <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('events')"><span class="btn-bracket">[</span> 事件劇情 <span class="btn-bracket">]</span></button><button class="title-btn" onclick="navigateTo('settings')"><span class="btn-bracket">[</span> 設定 <span class="btn-bracket">]</span></button></div><p class="title-credit">Data from ExportedProject (AssetRipper)</p></div></div><div id="screen-characters" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>角色列表</h2></div><div class="char-filter-bar"><input type="text" id="char-search" placeholder="搜尋角色..." oninput="filterCharacters()"><div class="filter-stars" id="filter-stars"><label><input type="checkbox" value="5" checked onchange="filterCharacters()"> ★5</label><label><input type="checkbox" value="4" checked onchange="filterCharacters()"> ★4</label><label><input type="checkbox" value="3" checked onchange="filterCharacters()"> ★3</label><label><input type="checkbox" value="2" checked onchange="filterCharacters()"> ★2</label><label><input type="checkbox" value="1" checked onchange="filterCharacters()"> ★1</label></div></div><div class="char-grid" id="char-grid"></div></div><div id="screen-story-list" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2 id="story-list-title">章節列表</h2></div><div class="story-list" id="story-list"></div></div><div id="screen-events" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>事件劇情</h2></div><div class="event-grid" id="event-grid"></div></div><div id="screen-char-select" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('characters')">← 返回</button><h2 id="select-char-name">角色選擇</h2></div><div class="select-panel" id="char-select-panel"><div class="select-btn" id="btn-select-normal"><img class="select-btn-img"><span class="select-btn-label">Normal</span></div><div class="select-btn" id="btn-select-cg"><img class="select-btn-img"><span class="select-btn-label">R18/CG</span></div></div></div><div id="screen-settings" class="screen"><div class="screen-header"><button class="back-btn" onclick="navigateTo('title')">← 返回</button><h2>設定</h2></div><div class="settings-panel"><div class="setting-item"><label>文字速度</label><input type="range" id="text-speed" min="10" max="100" value="40" oninput="updateSettings()"><span id="text-speed-label">中等</span></div><div class="setting-item"><label>自動模式延迟</label><input type="range" id="auto-delay" min="500" max="5000" step="100" value="2000" oninput="updateSettings()"><span id="auto-delay-label">2.0s</span></div><div class="setting-item"><label>字體大小</label><input type="range" id="font-size" min="14" max="32" value="20" oninput="updateSettings()"><span id="font-size-label">20px</span></div></div></div><div id="screen-reader" class="screen"><div class="reader-bg" id="reader-bg"><div class="reader-bg-16-9"><div class="reader-bg-color" id="reader-bg-color"></div><img class="reader-bg-img" id="reader-bg-img" style="display:none"><div class="reader-sprite" id="reader-sprite"><img class="sprite-layer" id="sprite-01"><img class="sprite-layer" id="sprite-02"><img class="sprite-layer" id="sprite-03"></div></div></div><div class="reader-top-bar"><button class="reader-btn" onclick="exitReader()">✕ 退出</button><span class="reader-title" id="reader-title">讀取中...</span></div><div class="reader-area" id="reader-area"></div><div class="reader-dialog" id="reader-dialog"><div class="dialog-row"><img class="dialog-headicon" id="dialog-headicon"><div><div class="dialog-name" id="dialog-name"></div><div class="dialog-text" id="dialog-text"></div></div></div></div><div class="reader-controls"><button class="ctrl-btn" id="btn-auto" onclick="toggleAuto()">自動</button><button class="ctrl-btn" id="btn-skip" onclick="toggleSkip()">跳過</button><button class="ctrl-btn" onclick="prevLine()">▲</button><button class="ctrl-btn" onclick="nextLine()">▼ 下一句</button></div></div></div><script src="lib/pixi.min.js"></script><script src="lib/live2d.min.js"></script><script src="lib/live2dcubismcore.min.js"></script><script src="js/novel-reader.js"></script><script src="js/app.js"></script><script src="lib/pixi-live2d-display.min.js"></script><script src="js/live2d-renderer.js"></script></body></html>
